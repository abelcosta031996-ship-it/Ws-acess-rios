<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Gestão do catálogo publicado da WS Wattson Acessórios">
  <title>Gestão · WS Wattson Acessórios</title>
  <link rel="icon" href="assets/logo-original.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-page{min-height:100vh;padding:24px 6%;background:var(--creme)}
    .admin-shell{max-width:860px;margin:auto}
    .admin-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
    .admin-top img{width:112px;height:46px;object-fit:contain}
    .admin-top a,.admin-actions a{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
    .admin-card{background:#fff;border:1px solid var(--linha);padding:22px;margin-bottom:16px}
    .admin-card h1,.admin-card h2{font-family:Georgia,serif;font-weight:400;margin:0 0 8px}
    .admin-card h1{font-size:30px}.admin-card h2{font-size:22px}
    .admin-meta{color:var(--cinza);font-size:12px;margin:0}
    .admin-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .admin-actions a{display:inline-block;background:var(--dourado);color:#fff;padding:10px 13px}
    .admin-actions a:last-child{background:var(--preto)}
    .admin-status{color:var(--cinza);font-size:13px;margin:14px 0 0}
    .published-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .published-row{border-top:1px solid var(--linha);padding:11px 0}
    .published-row strong,.published-row span{display:block}.published-row span{color:var(--cinza);font-size:12px;margin-top:2px}
    .published-products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .published-product{border:1px solid var(--linha);background:#fff}
    .published-product img{width:100%;height:150px;object-fit:cover;background:#eee}
    .published-product div{padding:11px}.published-product strong,.published-product span,.published-product b{display:block}
    .published-product span{font-size:12px;color:var(--cinza);margin-top:3px}.published-product b{font-size:12px;color:var(--dourado);margin-top:7px}
    @media(max-width:700px){.admin-page{padding:16px 5%}.admin-top{margin-bottom:14px}.admin-card{padding:16px}.published-grid,.published-products{grid-template-columns:1fr 1fr}.published-product img{height:120px}}
    @media(max-width:420px){.published-products{grid-template-columns:1fr}.published-product img{height:180px}}
  </style>
</head>
<body>
  <main class="admin-page">
    <div class="admin-shell">
      <header class="admin-top"><a href="index.html"><img src="assets/logo-original.png" alt="WS Wattson Acessórios"></a><a href="index.html">Voltar ao site</a></header>
      <section class="admin-card">
        <h1>Catálogo publicado</h1>
        <p class="admin-meta" data-catalog-updated>Catálogo publicado</p>
        <p class="admin-status" data-catalog-status></p>
        <div class="admin-actions"><a data-edit-catalog target="_blank" rel="noopener noreferrer">Editar no GitHub</a><a data-open-actions target="_blank" rel="noopener noreferrer">Publicar pelas Actions</a></div>
      </section>
      <section class="admin-card" data-published-collections><h2>Colecções publicadas</h2></section>
      <section class="admin-card" data-published-products><h2>Pulseiras publicadas</h2></section>
    </div>
  </main>
  <script src="admin.js?v=compact-published"></script>
</body>
</html>
